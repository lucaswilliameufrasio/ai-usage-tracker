# Pins are full commit SHAs. Versions were checked on 2026-10-30.
# actions/checkout v7.0.1: https://github.com/actions/checkout/releases/tag/v7.0.1
# actions/setup-go v7.0.0: https://github.com/actions/setup-go/releases/tag/v7.0.0
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Package the agent
        run: sh scripts/package-agent.sh --version "${GITHUB_REF_NAME#v}" --out dist/release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" \
            dist/release/ai-usage_*.tar.gz \
            dist/release/checksums.txt \
            dist/release/agent-installer.sh \
            --title "$tag" \
            --notes-file dist/release/notes.md
